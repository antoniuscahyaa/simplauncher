name: Build SimpLauncher

# Cara pakai:
# 1. Simpan file ini di repo sebagai  .github/workflows/build.yml
# 2. Upload SATU file zip proyek ke ROOT repo (mis. SimpLauncher-src.zip), lalu commit.
#    Setiap ada zip baru/berubah di root repo, build jalan otomatis.
# 3. APK hasil build ada di tab Releases (unduh langsung .apk) dan di Artifacts.
#
# Secrets yang harus dibuat di Settings > Secrets and variables > Actions:
#   KEYSTORE_BASE64    isi keystore lama (.jks / .keystore) yang di-base64 satu baris
#   KEYSTORE_PASSWORD  password keystore
#   KEY_ALIAS          alias key
#   KEY_PASSWORD       password key

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Nama file zip di root repo (kosongkan = zip terakhir yang di-commit)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_NAME: SimpLauncher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pilih file zip
        shell: bash
        env:
          INPUT_ZIP: ${{ github.event.inputs.zip_name }}
        run: |
          ZIP="$INPUT_ZIP"
          if [ -z "$ZIP" ]; then
            # zip di root repo yang terakhir disentuh oleh sebuah commit
            ZIP=$(git log -1 --diff-filter=AM --name-only --format= -- '*.zip' | grep -v '/' | head -n1 || true)
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Tidak ada file .zip di root repo. Upload zip proyek dulu."
            exit 1
          fi
          echo "Zip yang dibangun: $ZIP"
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Ekstrak zip
        shell: bash
        run: |
          SRC="$RUNNER_TEMP/src"
          rm -rf "$SRC" && mkdir -p "$SRC"
          unzip -q "$ZIP_FILE" -d "$SRC"
          SETTINGS=$(find "$SRC" -maxdepth 3 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -not -path '*/__MACOSX/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan di dalam zip."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Folder proyek: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore dipasang."
          else
            echo "::warning::Secret KEYSTORE_BASE64 kosong. APK akan ditandatangani dengan debug key."
          fi

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Kumpulkan APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" -path '*build/outputs/apk/release/*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          OUT="$GITHUB_WORKSPACE/out/${APP_NAME}-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUT"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: out/*.apk

      - name: Buat Release (APK bisa diunduh langsung dari HP)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" "$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "${APP_NAME} build ${GITHUB_RUN_NUMBER}" \
            --notes "Dibangun dari ${ZIP_FILE} (commit ${GITHUB_SHA::7})." \
            --prerelease

      - name: Ringkasan error
        if: failure()
        shell: bash
        run: |
          {
            echo '### Error build'
            echo '```'
            if [ -f build.log ]; then
              grep -E '^e: |error:|FAILED|What went wrong' -A4 build.log | head -n 80 || true
            else
              echo 'build.log belum ada (gagal sebelum tahap build).'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
